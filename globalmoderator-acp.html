<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naruto-Arena — Control Panel</title>
  <link rel="stylesheet" href="brand.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ca-void); color: var(--ca-bone); font-family: var(--font-ui), sans-serif; }
    main { width: min(960px, 100%); margin: 0 auto; padding: 32px 22px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 20px; }
    h1 { margin: 0; color: var(--ca-orange); font-size: clamp(26px, 4vw, 38px); text-transform: uppercase; }
    h2 { margin: 0 0 8px; font-size: 21px; }
    p { color: var(--ca-parchment); line-height: 1.5; }
    a { color: inherit; }
    .back { font-size: 13px; }
    .tool { display: block; margin-top: 30px; padding: 24px; border: 1px solid rgba(232,128,26,.5); background: #10131c; text-decoration: none; }
    .tool:hover, .tool:focus-visible { background: rgba(232,128,26,.1); outline-color: var(--ca-orange); }
    .tool span { color: var(--ca-orange); font-weight: 800; }
    @media (max-width: 600px) { header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Control Panel</h1><a class="back" href="index.html">Back to site</a></header>
    <a class="tool" href="charactercreator.html">
      <h2>Character Creator</h2>
      <p>Draft character ideas and discuss changes with the character and balance team.</p>
      <span>Open Character Creator →</span>
    </a>
  </main>
</body>
</html>
